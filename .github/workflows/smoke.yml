# Production-adjacent readiness: import + dry-run paths.
# Does NOT require Headroom, LiteLLM, GPUs, or home-lab secrets.
name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Compile Python packages
        run: python -m compileall -q tok_tua grok_tua context

      - name: Import packages
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -c "import tok_tua, grok_tua; print('imports ok')"

      - name: Providers and resolve
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m tok_tua providers
          python -m tok_tua resolve --cli pi --model manager-code

      - name: Loop dry-run
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          export TOK_TUA_LOOP_DRY_RUN=1
          python -m tok_tua loop --cli pi --model manager-code --name ci-smoke --no-write

      - name: Herdr argv shape (unit)
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -c "from tok_tua.scale import build_herdr_start_argv; plan={'short_command':'pi --help','effective_cli':'pi','cli':'pi','model':'manager-code','kind':'cli'}; print(build_herdr_start_argv('ci', plan, pane_id='p0'))"

      - name: Config JSON parse
        run: python -c "import json; json.load(open('config/tok_tua.json')); json.load(open('config/qqq_orchestration.json')); print('config ok')"

      - name: Deny-list scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("README.md"), Path("AGENTS.md"), Path("docs"), Path("tok_tua"), Path("bin"), Path("config")]
          # Avoid matching this script: patterns for clinical staging / keys
          pat = re.compile(
              r"horizon_2026|/Volumes/ai-data|192\.168\.|BEGIN (?:RSA |OPENSSH )?PRIVATE KEY|sk-[a-zA-Z0-9]{24,}",
              re.I,
          )
          hits = []
          for root in roots:
              paths = [root] if root.is_file() else list(root.rglob("*"))
              for p in paths:
                  if not p.is_file() or p.suffix in {".png", ".jpg", ".pyc"}:
                      continue
                  try:
                      text = p.read_text(encoding="utf-8", errors="replace")
                  except OSError:
                      continue
                  for i, line in enumerate(text.splitlines(), 1):
                      if pat.search(line):
                          hits.append(f"{p}:{i}:{line[:120]}")
          if hits:
              print("\n".join(hits))
              raise SystemExit("deny-list hit in public tree")
          print("deny-list clean")
          PY
